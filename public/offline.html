<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · SmartCore Gym</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #0f172a;
        --muted: #64748b;
        --primary: #10b77f;
        --card: #f8fafc;
        --border: #e2e8f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --fg: #f1f5f9;
          --muted: #94a3b8;
          --card: #1e293b;
          --border: #334155;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 420px;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 40px 28px;
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 18px;
        background: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0 0 24px; font-size: 14px; line-height: 1.6; color: var(--muted); }
      button {
        width: 100%;
        padding: 12px 20px;
        border: 0;
        border-radius: 12px;
        background: var(--primary);
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.08); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 512 512" width="34" height="34" fill="#fff">
          <rect x="140" y="236" width="232" height="40" rx="20" />
          <rect x="108" y="196" width="48" height="120" rx="18" />
          <rect x="356" y="196" width="48" height="120" rx="18" />
          <rect x="72" y="216" width="32" height="80" rx="14" />
          <rect x="408" y="216" width="32" height="80" rx="14" />
        </svg>
      </div>
      <h1>Sin conexión</h1>
      <p>
        No pudimos conectarnos al servidor. SmartCore Gym necesita internet para
        mostrar los datos de tu gimnasio. Revisá la conexión y volvé a intentar.
      </p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
